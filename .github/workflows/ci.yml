# `-m "not camera"` deselects camera-marked tests; the remaining hardware fixtures
# skip because the default picamera2 backend cannot be built on the runner
# (the subprocess backend would raise FileNotFoundError for rpicam-still instead).
# DATABASE_URL is set because `get_url` in alembic/env.py reads DATABASE_URL from
# the environment before falling back to app settings, and `db-check-drift` needs
# it to reach the postgres service below.
name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: captua
          POSTGRES_PASSWORD: captua
          POSTGRES_DB: captua
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: dev
          cache: true

      # tests/unit/test_image_upload.py runs a real rclone against a local
      # directory remote. Pinned to the version the appliance carries, and
      # checked against the SHA256 published in that release's SHA256SUMS.
      - name: Install rclone v1.70.2
        env:
          RCLONE_ZIP: rclone-v1.70.2-linux-amd64.zip
          RCLONE_SHA256: 7bfa813f426820d20436e48a4e0b9bf21977fcd513a48f2d28eede3136b4bacb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://downloads.rclone.org/v1.70.2/$RCLONE_ZIP"
          echo "$RCLONE_SHA256  $RCLONE_ZIP" | sha256sum -c -
          unzip -q "$RCLONE_ZIP"
          mkdir -p rclone-bin
          mv rclone-v1.70.2-linux-amd64/rclone rclone-bin/rclone
          rclone-bin/rclone version | head -1

      - name: Unit and integration tests
        run: pixi run -e dev pytest tests/ -m "not camera" -q
        env:
          CAPTUA_TEST_RCLONE: ${{ runner.temp }}/rclone-bin/rclone
          CAPTUA_LOG_DIR: ${{ runner.temp }}/captua-logs
          CAPTUA_DATA_DIR: ${{ runner.temp }}/captua-data
          APP_ENV: test

      - name: Schema drift guard
        run: pixi run -e dev db-check-drift
        env:
          DATABASE_URL: postgresql+psycopg://captua:captua@localhost:${{ job.services.postgres.ports[5432] }}/captua
          CAPTUA_LOG_DIR: ${{ runner.temp }}/captua-logs
          CAPTUA_DATA_DIR: ${{ runner.temp }}/captua-data
          APP_ENV: test
