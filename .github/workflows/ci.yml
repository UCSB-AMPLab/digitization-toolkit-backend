# `-m "not camera"` deselects camera-marked tests; the remaining hardware fixtures
# skip because the default picamera2 backend cannot be built on the runner
# (the subprocess backend would raise FileNotFoundError for rpicam-still instead).
# DATABASE_URL is set because `get_url` in alembic/env.py reads DATABASE_URL from
# the environment before falling back to app settings, and `db-check-drift` needs
# it to reach the postgres service below.
name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: captua
          POSTGRES_PASSWORD: captua
          POSTGRES_DB: captua
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: dev
          cache: true

      # tests/unit/test_image_upload.py runs a real rclone against a local
      # directory remote. Pinned to the version the appliance carries, and
      # checked against the SHA256 published in that release's SHA256SUMS.
      - name: Install rclone v1.70.2
        env:
          RCLONE_ZIP: rclone-v1.70.2-linux-amd64.zip
          RCLONE_SHA256: 7bfa813f426820d20436e48a4e0b9bf21977fcd513a48f2d28eede3136b4bacb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://downloads.rclone.org/v1.70.2/$RCLONE_ZIP"
          echo "$RCLONE_SHA256  $RCLONE_ZIP" | sha256sum -c -
          unzip -q "$RCLONE_ZIP"
          mkdir -p rclone-bin
          mv rclone-v1.70.2-linux-amd64/rclone rclone-bin/rclone
          rclone-bin/rclone version | head -1

      - name: Unit and integration tests
        run: pixi run -e dev pytest tests/ -m "not camera" -q
        env:
          CAPTUA_TEST_RCLONE: ${{ runner.temp }}/rclone-bin/rclone
          CAPTUA_LOG_DIR: ${{ runner.temp }}/captua-logs
          CAPTUA_DATA_DIR: ${{ runner.temp }}/captua-data
          APP_ENV: test

      # The step above leaves DATABASE_* unset on purpose. Its tests get their
      # databases from the db_session fixtures, which build a SQLite file per
      # test, but app.core.config reads DATABASE_* at import and app.core.db
      # builds its engine from them, so setting them there would point every
      # code path that uses that engine at this service.
      #
      # The tests that need PostgreSQL skip unless DATABASE_HOST is set:
      # tests/integration/test_pg_*.py (row locks, which SQLite does not take)
      # and the migration tests named *_on_postgresql. Each creates a schema of
      # its own in the database DATABASE_* names and drops it afterwards, so
      # they share the service database with the drift guard below, which
      # migrates and compares only the default schema. `-k` selects them by
      # name, so a test added under either name is picked up.
      #
      # A skipped PostgreSQL test fails this step: it means DATABASE_* did not
      # reach the service, and pytest exits 0 on skips. The check reads the
      # JUnit report and counts the test cases in test_pg_* modules or named
      # *_on_postgresql, a module skipped at import among them; at least one
      # must be there and none may be skipped. Skips reported by other modules
      # while they are collected are not counted.
      - name: PostgreSQL tests
        run: |
          pixi run -e dev pytest tests/ -k "test_pg_ or on_postgresql" -q --junitxml="$RUNNER_TEMP/pg-tests.xml"
          python3 -I - "$RUNNER_TEMP/pg-tests.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          # A module skipped at import is reported with an empty classname and
          # the module's dotted path as its name.
          def node(c):
              return f"{c.get('classname', '')}.{c.get('name', '')}"
          cases = [c for c in ET.parse(sys.argv[1]).getroot().iter("testcase")
                   if "test_pg_" in node(c) or "on_postgresql" in node(c)]
          skipped = [c for c in cases if c.find("skipped") is not None]
          print(f"PostgreSQL tests: {len(cases)} in the report, {len(skipped)} skipped")
          for c in skipped:
              reason = (c.find("skipped").get("message") or "").splitlines()[:1]
              print(f"  skipped: {node(c).lstrip('.')}: {''.join(reason)}")
          if not cases or skipped:
              sys.exit("PostgreSQL tests were skipped or none ran: check DATABASE_* and the postgres service")
          EOF
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: ${{ job.services.postgres.ports[5432] }}
          DATABASE_USER: captua
          DATABASE_PASSWORD: captua
          DATABASE_NAME: captua
          CAPTUA_LOG_DIR: ${{ runner.temp }}/captua-logs
          CAPTUA_DATA_DIR: ${{ runner.temp }}/captua-data
          APP_ENV: test

      - name: Schema drift guard
        run: pixi run -e dev db-check-drift
        env:
          DATABASE_URL: postgresql+psycopg://captua:captua@localhost:${{ job.services.postgres.ports[5432] }}/captua
          CAPTUA_LOG_DIR: ${{ runner.temp }}/captua-logs
          CAPTUA_DATA_DIR: ${{ runner.temp }}/captua-data
          APP_ENV: test
